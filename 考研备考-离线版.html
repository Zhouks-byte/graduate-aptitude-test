<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="考研择校 · 志愿模拟 · 报名模拟 · 成绩分析 · 计划 · 模考 · 笔记，数据仅存本机，可离线使用" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="color-scheme" content="light dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="考研备考" />
  <title>考研备考</title>
  
  
<style>
/* ============ 考研备考 · 设计系统 ============ */

/* 品牌 / 语义色 */
:root {
  /* 品牌色 */
  --brand-50:  #eef2ff;
  --brand-100: #e0e7ff;
  --brand-200: #c7d2fe;
  --brand-300: #a5b4fc;
  --brand-400: #818cf8;
  --brand-500: #6366f1;
  --brand-600: #4f46e5;
  --brand-700: #4338ca;
  --brand-800: #3730a3;
  --brand-900: #312e81;

  /* 中性灰阶 */
  --gray-0:  #ffffff;
  --gray-50: #f9fafb;
  --gray-100:#f3f4f6;
  --gray-200:#e5e7eb;
  --gray-300:#d1d5db;
  --gray-400:#9ca3af;
  --gray-500:#6b7280;
  --gray-600:#4b5563;
  --gray-700:#374151;
  --gray-800:#1f2937;
  --gray-900:#111827;

  /* 语义色 ok / warn / bad */
  --ok:   #10b981;
  --ok-bg: #d1fae5;
  --warn: #f59e0b;
  --warn-bg:#fef3c7;
  --bad:  #ef4444;
  --bad-bg:#fee2e2;

  /* 表面 / 文本 */
  --surface: var(--gray-0);
  --surface-alt: var(--gray-50);
  --text: var(--gray-900);
  --text-secondary: var(--gray-600);
  --text-muted: var(--gray-400);
  --border: var(--gray-200);

  /* 圆角 */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 24px;

  /* 间距（4 的倍数） */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-6: 24px;
  --sp-8: 32px;
  --sp-12: 48px;

  /* 阴影 */
  --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
  --shadow-md: 0 4px 12px -2px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 32px -4px rgba(0,0,0,0.12);

  /* 布局 */
  --topbar-h: 56px;
  --sidebar-w: 220px;
  --tabbar-h: 44px;
  --tabbar-rows: 2;
  --tabbar-total-h: calc(var(--tabbar-rows) * var(--tabbar-h) + env(safe-area-inset-bottom));

  /* 字体 */
  --font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
}

/* 深色模式 */
@media (prefers-color-scheme: dark) {
  :root {
    --gray-0:  #0f172a;
    --gray-50: #1e293b;
    --gray-100:#1e293b;
    --gray-200:#334155;
    --gray-300:#475569;
    --gray-400:#94a3b8;
    --gray-500:#64748b;
    --gray-600:#cbd5e1;
    --gray-700:#e2e8f0;
    --gray-800:#f1f5f9;
    --gray-900:#f8fafc;

    --surface: var(--gray-0);
    --surface-alt: var(--gray-50);
    --text: var(--gray-900);
    --text-secondary: var(--gray-600);
    --text-muted: var(--gray-400);
    --border: var(--gray-200);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: var(--font-family);
  background: var(--surface);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ============ 布局骨架 ============ */
.app-shell {
  display: grid;
  grid-template-areas:
    "topbar topbar"
    "sidebar main";
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: var(--topbar-h) 1fr;
  height: 100vh;
}

/* 顶部栏 */
.topbar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: 0 var(--sp-4);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}
.topbar__left { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.topbar__logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px; height: 32px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--brand-500), var(--brand-700));
  color: #fff;
  font-weight: 700;
  font-size: 13px;
}
.topbar__title { font-size: 16px; font-weight: 600; margin: 0; }

.topbar__center {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-1);
  background: var(--brand-50);
  border: 1px solid var(--brand-100);
  border-radius: var(--radius-md);
  padding: var(--sp-1) var(--sp-3);
  min-width: 0;
}
.topbar__label { font-size: 12px; color: var(--text-secondary); }
.topbar__days {
  font-size: 18px;
  font-weight: 700;
  color: var(--brand-600);
  font-variant-numeric: tabular-nums;
}
.topbar__unit { font-size: 12px; color: var(--text-secondary); }

.topbar__right { display: flex; align-items: center; gap: var(--sp-2); }

/* 按钮 */
.btn {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: var(--radius-md);
  padding: var(--sp-1) var(--sp-3);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
}
.btn:hover { background: var(--surface-alt); }
.btn--primary {
  background: var(--brand-600);
  border-color: var(--brand-600);
  color: #fff;
}
.btn--primary:hover { background: var(--brand-700); }
.btn--primary.is-checked {
  background: var(--ok);
  border-color: var(--ok);
}
/* 幽灵 / 图标按钮（导出、导入） */
.btn--ghost {
  background: transparent;
  border-color: var(--border);
  color: var(--text-secondary);
}
.btn--ghost:hover {
  background: var(--surface-alt);
  border-color: var(--brand-400);
  color: var(--brand-600);
}
.btn--icon { font-size: 12px; padding: var(--sp-1) var(--sp-2); white-space: nowrap; }

/* 顶栏右侧按钮组：在小屏下收缩为图标 */
.topbar__right .btn--ghost .btn-label { display: inline; }

/* 离线 / 导入提示条 */
.offline-hint {
  position: fixed;
  left: 50%;
  /* 移动端：悬浮在双行 tabbar 之上（含 safe-area）；桌面端（≥481px 无 tabbar）：贴底 */
  bottom: calc(var(--tabbar-total-h) + var(--sp-4));
  transform: translateX(-50%) translateY(20px);
  background: var(--gray-800);
  color: #fff;
  font-size: 13px;
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s, transform .25s;
  z-index: 200;
  max-width: 90vw;
  text-align: center;
}
.offline-hint.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
@media (min-width: 481px) {
  .offline-hint { bottom: var(--sp-4); }
}

/* 侧栏（桌面） */
.sidebar {
  grid-area: sidebar;
  background: var(--surface-alt);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: var(--sp-4) var(--sp-2);
}
.sidebar__list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-1); }
.nav-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--radius-md);
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 14px;
  transition: all 0.15s;
  user-select: none;
}
.nav-item:hover { background: var(--surface); color: var(--text); }
.nav-item.is-active {
  background: var(--brand-600);
  color: #fff;
}
.nav-item__icon { width: 20px; text-align: center; font-size: 15px; }

/* 主区 */
.main {
  grid-area: main;
  overflow-y: auto;
  padding: var(--sp-6);
  background: var(--surface);
}
.view { display: none; }
.view.is-active { display: block; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* 占位卡片 */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--sp-6);
  box-shadow: var(--shadow-sm);
}
.card__title {
  margin: 0 0 var(--sp-2);
  font-size: 16px;
  font-weight: 600;
}
.card__desc {
  color: var(--text-secondary);
  margin: 0;
  font-size: 13px;
}
.card__body { margin-top: var(--sp-4); }

/* 底部 Tab（移动） */
.tabbar {
  display: none;
}
.tabbar__item {
  min-height: 44px;
  touch-action: manipulation;
}

/* ============ 响应式 ============ */
@media (max-width: 768px) {
  .app-shell {
    grid-template-areas:
      "topbar"
      "main";
    grid-template-columns: 1fr;
    /* tabbar 双行 5+4：用自定义属性 --tabbar-total-h 计算实际占位（含 safe-area） */
    grid-template-rows: var(--topbar-h) 1fr var(--tabbar-total-h);
  }
  .sidebar { display: none; }
  .main {
    padding: var(--sp-4);
    /* 底部留白 = 双行 tabbar 实际高度 + 间距 + safe-area，避免遮挡与横向滚动 */
    padding-bottom: calc(var(--tabbar-total-h) + var(--sp-4));
  }
  .topbar__center { min-width: 0; }
  .topbar__days { font-size: 16px; }

  /* 双行 tabbar：5 + 4，每格 ≥44px 高，图标+文字 11px */
  .tabbar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-auto-rows: var(--tabbar-h);
    background: var(--surface);
    border-top: 1px solid var(--border);
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 10;
    padding-bottom: env(safe-area-inset-bottom);
    box-sizing: content-box;
  }
  /* 第二行 4 个 Tab 居中：首尾各空一格（row2 列1/5 不渲染，天然留白） */
  .tabbar__item:nth-child(6) { grid-column: 2; }
  .tabbar__item:nth-child(9) { grid-column: 4; }

  .tabbar__item {
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 11px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    padding: 0;
    line-height: 1.2;
    min-height: var(--tabbar-h);
    /* 图标与文字间距收窄，保证 44px 内完整呈现 */
  }
  .tabbar__item.is-active { color: var(--brand-600); font-weight: 600; }
  /* 顶栏数据按钮：窄屏收缩，仅保留图标感 */
  .topbar__right .btn--ghost { padding: var(--sp-1); font-size: 11px; }
}

/* ≤480px：顶栏倒计时进一步收缩 + 导出/导入按钮纯图标化 */
@media (max-width: 480px) {
  .topbar__label { display: none; }
  .topbar__days { font-size: 14px; }
  .topbar__unit { display: none; }
  /* 导出/导入：隐藏文字，仅保留箭头图标 */
  .topbar__right .btn--ghost {
    padding: var(--sp-1) var(--sp-2);
    position: relative;
    overflow: hidden;
  }
  .topbar__right .btn--ghost .btn-txt { display: none; }
  /* 用 ::before 把箭头图标居中 */
  .topbar__right .btn--ghost::before {
    content: attr(data-icon);
    font-size: 15px;
    line-height: 1;
  }
  .topbar__right .btn--primary { padding: var(--sp-1) var(--sp-2); font-size: 12px; }
}

/* ============ 题库练习模块 ============ */

/* 筛选栏 */
.quiz-filters {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
  align-items: center;
  margin-bottom: var(--sp-4);
  padding: var(--sp-3);
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.quiz-filters__group {
  display: flex;
  align-items: center;
  gap: var(--sp-1);
}
.quiz-filters__label {
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
}
.chip {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-secondary);
  border-radius: 999px;
  padding: var(--sp-1) var(--sp-3);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.chip:hover { border-color: var(--brand-400); color: var(--brand-600); }
.chip.is-active {
  background: var(--brand-600);
  border-color: var(--brand-600);
  color: #fff;
}
.quiz-filters__search {
  flex: 1;
  min-width: 140px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius-md);
  padding: var(--sp-1) var(--sp-3);
  font-size: 13px;
  color: var(--text);
  outline: none;
}
.quiz-filters__search:focus { border-color: var(--brand-500); }
.quiz-filters__limit {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}
.quiz-filters__limit input {
  width: 48px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius-md);
  padding: var(--sp-1) var(--sp-2);
  font-size: 13px;
  color: var(--text);
  text-align: center;
}

/* 题目卡片列表 */
.quiz-list { display: flex; flex-direction: column; gap: var(--sp-3); }
.quiz-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--sp-4);
  transition: box-shadow 0.15s;
}
.quiz-card:hover { box-shadow: var(--shadow-md); }
.quiz-card__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-2);
  font-size: 12px;
}
.quiz-card__subject {
  background: var(--brand-50);
  color: var(--brand-700);
  border: 1px solid var(--brand-100);
  padding: 1px var(--sp-2);
  border-radius: var(--radius-sm);
}
.quiz-card__chapter { color: var(--text-secondary); }
.quiz-card__type {
  color: var(--text-muted);
}
.quiz-card__diff {
  color: var(--warn);
  font-weight: 600;
}
.quiz-card__stem {
  margin: 0 0 var(--sp-3);
  font-size: 14px;
  line-height: 1.6;
}
.quiz-card__actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: var(--sp-3);
  padding-top: var(--sp-3);
  border-top: 1px dashed var(--border);
}
.quiz-card__fav {
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 16px;
  color: var(--text-muted);
  transition: transform 0.15s, color 0.15s;
}
.quiz-card__fav.is-fav { color: var(--warn); transform: scale(1.1); }
.quiz-card__fav:hover { color: var(--warn); }

/* 答题面板 */
.quiz-panel {
  position: fixed;
  inset: 0;
  background: var(--surface);
  z-index: 100;
  overflow-y: auto;
  display: none;
}
.quiz-panel.is-open { display: block; }
.quiz-panel__inner {
  max-width: 720px;
  margin: 0 auto;
  padding: var(--sp-6) var(--sp-4);
  padding-bottom: calc(var(--sp-6) + 40px);
}
.quiz-panel__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--sp-4);
  padding-bottom: var(--sp-3);
  border-bottom: 1px solid var(--border);
}
.quiz-panel__close {
  border: none;
  background: var(--surface-alt);
  color: var(--text-secondary);
  width: 32px;
  height: 32px;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-size: 16px;
}
.quiz-panel__close:hover { background: var(--border); }

/* 限时倒计时 */
.quiz-timer {
  display: none;
  align-items: center;
  gap: var(--sp-2);
  font-size: 14px;
  font-weight: 600;
  color: var(--brand-600);
  background: var(--brand-50);
  border: 1px solid var(--brand-100);
  padding: var(--sp-1) var(--sp-3);
  border-radius: var(--radius-md);
  font-variant-numeric: tabular-nums;
}
.quiz-timer.is-active { display: inline-flex; }
.quiz-timer.is-danger { color: var(--bad); background: var(--bad-bg); border-color: var(--bad); }
.quiz-timer__bar {
  width: 80px;
  height: 4px;
  background: var(--brand-100);
  border-radius: 999px;
  overflow: hidden;
}
.quiz-timer__bar-fill {
  height: 100%;
  background: var(--brand-500);
  width: 100%;
  transition: width 0.2s linear;
}
.quiz-timer.is-danger .quiz-timer__bar-fill { background: var(--bad); }
.quiz-timer.is-danger .quiz-timer__bar { background: var(--bad-bg); }

/* 选项 */
.quiz-opts { list-style: none; margin: var(--sp-3) 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-2); }
.quiz-opt {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--sp-3);
  cursor: pointer;
  transition: all 0.15s;
  background: var(--surface);
  font-size: 14px;
  line-height: 1.5;
}
.quiz-opt:hover { border-color: var(--brand-400); background: var(--brand-50); }
.quiz-opt.is-selected {
  border-color: var(--brand-600);
  background: var(--brand-50);
  box-shadow: inset 0 0 0 1px var(--brand-600);
}
.quiz-opt__badge {
  flex-shrink: 0;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--gray-100);
  color: var(--text-secondary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
}
.quiz-opt.is-selected .quiz-opt__badge { background: var(--brand-600); color: #fff; }
.quiz-opt__text { flex: 1; }

/* 填空输入 */
.quiz-blank {
  width: 100%;
  border: 1px solid var(--border);
  background: var(--surface-alt);
  border-radius: var(--radius-md);
  padding: var(--sp-2) var(--sp-3);
  font-size: 14px;
  color: var(--text);
  outline: none;
  margin: var(--sp-2) 0;
}
.quiz-blank:focus { border-color: var(--brand-500); }

/* 答题结果反馈 */
.quiz-feedback { margin-top: var(--sp-4); display: none; }
.quiz-feedback.is-shown { display: block; }
.quiz-feedback__result {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--radius-md);
  font-weight: 600;
  margin-bottom: var(--sp-2);
}
.quiz-feedback__result.is-correct {
  background: var(--ok-bg);
  color: var(--gray-800);
}
.quiz-feedback__result.is-wrong {
  background: var(--bad-bg);
  color: var(--gray-800);
}
.quiz-feedback__analysis {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--sp-3);
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
}
.quiz-feedback__analysis strong { color: var(--text); }

/* 结果汇总 */
.quiz-result {
  text-align: center;
  padding: var(--sp-8) 0;
}
.quiz-result__score {
  font-size: 40px;
  font-weight: 700;
  color: var(--brand-600);
  margin-bottom: var(--sp-2);
}
.quiz-result__meta { color: var(--text-secondary); font-size: 14px; margin-bottom: var(--sp-4); }
.quiz-result__actions { display: flex; justify-content: center; gap: var(--sp-3); }

/* 面板内按钮行 */
.quiz-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--sp-3) 0;
}
.quiz-actions__nav { display: flex; gap: var(--sp-2); }

@media (max-width: 768px) {
  .quiz-panel__inner { padding: var(--sp-4); }
  .quiz-filters { gap: var(--sp-1); }
  .quiz-filters__group { flex-wrap: wrap; }
}

/* ≤480px：答题面板底部抽屉式（从底滑入、上方圆角、内容可滚、选项行高加大） */
@media (max-width: 480px) {
  .quiz-panel {
    position: fixed;
    inset: auto 0 0 0;                 /* 贴底 */
    top: auto;
    height: 88vh;
    min-height: 400px;
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.2);
    overflow: hidden;
  }
  .quiz-panel.is-open {
    display: block;
    animation: kp-sheet-up 0.28s cubic-bezier(.22,.61,.36,1);
  }
  @keyframes kp-sheet-up {
    from { transform: translateY(40%); opacity: 0.4; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  .quiz-panel__inner {
    max-width: none;
    padding: var(--sp-3) var(--sp-3) 0;
    padding-bottom: calc(var(--sp-4) + env(safe-area-inset-bottom));
    overflow-y: auto;
    height: 100%;
    -webkit-overflow-scrolling: touch;
  }
  /* 标题区：抓握条 + 可点关闭 */
  .quiz-panel__header {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--surface);
    padding-top: var(--sp-2);
  }
  .quiz-panel__header::before {
    content: '';
    display: block;
    width: 36px;
    height: 4px;
    border-radius: 999px;
    background: var(--gray-300);
    margin: 0 auto var(--sp-2);
  }
  .quiz-panel__close {
    width: 44px;
    height: 44px;
    font-size: 18px;
    flex-shrink: 0;
  }
  /* 选项行高加大，方便手指点选（≥44px） */
  .quiz-opt {
    padding: var(--sp-3) var(--sp-3);
    min-height: 44px;
    font-size: 15px;
    line-height: 1.6;
  }
  .quiz-opt__badge { width: 26px; height: 26px; font-size: 13px; }
  .quiz-blank { font-size: 15px; padding: var(--sp-3); min-height: 44px; }
  .quiz-actions .btn, .quiz-result__actions .btn { min-height: 44px; }
}

/* ============ 错题本聚合页 ============ */

.mistakes-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-4);
  margin-bottom: var(--sp-4);
  padding-bottom: var(--sp-3);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

/* 科目 Tab */
.mistakes-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
  margin-bottom: var(--sp-4);
}

/* 错题列表 */
.mistakes-list {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}
.mistake-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--sp-4);
  border-left: 3px solid var(--bad);
}
.mistake-item--missing {
  border-left-color: var(--gray-300);
  opacity: 0.7;
}
.mistake-item__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-2);
  font-size: 12px;
}
.mistake-item__subject {
  background: var(--brand-50);
  color: var(--brand-700);
  border: 1px solid var(--brand-100);
  padding: 1px var(--sp-2);
  border-radius: var(--radius-sm);
}
.mistake-item__chapter { color: var(--text-secondary); }
.mistake-item__type { color: var(--text-muted); }
.mistake-item__retries {
  margin-left: auto;
  color: var(--warn);
  font-weight: 600;
}
.mistake-item__stem {
  margin: 0 0 var(--sp-3);
  font-size: 14px;
  line-height: 1.6;
}
.mistake-item__reason {
  color: var(--bad);
  font-size: 12px;
  margin-top: var(--sp-2);
}

/* 答案对照行 */
.mistake-item__answers {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  margin-top: var(--sp-2);
}
.answer-line {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  font-size: 13px;
  padding: var(--sp-1) var(--sp-2);
  border-radius: var(--radius-sm);
}
.answer-line__label {
  flex-shrink: 0;
  font-size: 11px;
  color: var(--text-muted);
  min-width: 64px;
}
.answer-line--ok { background: var(--ok-bg); color: var(--gray-800); }
.answer-line--bad { background: var(--bad-bg); color: var(--gray-800); }

.mistake-item__actions {
  display: flex;
  justify-content: flex-end;
  margin-top: var(--sp-3);
  padding-top: var(--sp-2);
  border-top: 1px dashed var(--border);
}

/* ============ 间隔复习模块 ============ */

.review-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-4);
  margin-bottom: var(--sp-4);
  padding-bottom: var(--sp-3);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

/* 进度条 */
.review-card__progress {
  flex: 1;
  min-width: 120px;
  height: 8px;
  background: var(--gray-100);
  border-radius: 999px;
  overflow: hidden;
}
.review-card__progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--brand-400), var(--ok));
  width: 0;
  transition: width 0.3s;
}

/* 科目分组 */
.review-list { display: flex; flex-direction: column; gap: var(--sp-4); }
.review-group {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--sp-3);
}
.review-group__title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: var(--sp-2);
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}
.review-group__count {
  background: var(--brand-50);
  color: var(--brand-700);
  border: 1px solid var(--brand-100);
  font-size: 11px;
  font-weight: 700;
  padding: 1px var(--sp-2);
  border-radius: 999px;
}
.review-group__items {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

/* 复习条目 */
.review-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--sp-3);
}
.review-item__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-1);
  font-size: 11px;
}
.review-item__chapter { color: var(--text-secondary); }
.review-item__type { color: var(--text-muted); }
.review-item__stage {
  color: var(--brand-600);
  font-weight: 600;
  margin-left: auto;
}
.review-item__stem {
  margin: 0 0 var(--sp-3);
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
}
.review-item__actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--sp-2);
}

/* 小按钮 + 语义按钮 */
.btn--sm {
  padding: var(--sp-1) var(--sp-2);
  font-size: 12px;
  border-radius: var(--radius-sm);
}
.btn--ok {
  background: var(--ok);
  border-color: var(--ok);
  color: #fff;
}
.btn--ok:hover { background: #059669; }
.btn--warn {
  background: var(--warn);
  border-color: var(--warn);
  color: #fff;
}
.btn--warn:hover { background: #d97706; }
.btn--bad {
  background: transparent;
  border-color: var(--bad);
  color: var(--bad);
}
.btn--bad:hover { background: var(--bad-bg); }

/* ============ 单词记忆模块 ============ */

.vocab-card { padding: var(--sp-4); }
.vocab-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
  padding-bottom: var(--sp-3);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

/* 卡片显示区 */
.vocab-card__zone { margin-bottom: var(--sp-3); }
.vocab-card__face {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--sp-6);
  min-height: 140px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: var(--sp-2);
  cursor: pointer;
  transition: border-color 0.15s;
}
.vocab-card__face:hover { border-color: var(--brand-400); }
.vocab-card__word {
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.5px;
}
.vocab-card__phonetic {
  font-size: 14px;
  color: var(--text-muted);
}
.vocab-card__stage {
  font-size: 12px;
  color: var(--brand-600);
  font-weight: 600;
}
.vocab-card__detail {
  margin-top: var(--sp-3);
  padding-top: var(--sp-3);
  border-top: 1px dashed var(--border);
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}
.vocab-card__detail.is-hidden { display: none; }
.vocab-card__meaning {
  font-size: 15px;
  font-weight: 600;
  color: var(--brand-700);
  line-height: 1.5;
}
.vocab-card__example {
  font-size: 13px;
  color: var(--text-secondary);
  font-style: italic;
  line-height: 1.5;
}
.vocab-card__done {
  background: var(--ok-bg);
  border: 1px solid var(--ok);
  border-radius: var(--radius-lg);
  padding: var(--sp-4);
  text-align: center;
  color: var(--gray-800);
  font-size: 14px;
}

/* 卡片下方操作区 */
.vocab-actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-3);
}
.vocab-rate {
  display: flex;
  gap: var(--sp-2);
}
.vocab-card__done {
  display: block;
}

/* ============ 真题模块 ============ */

.past-card { padding: var(--sp-4); }
.past-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
  padding-bottom: var(--sp-3);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

/* 筛选区 */
.past-filters {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  margin-bottom: var(--sp-4);
}
.past-filters__group {
  display: flex;
  align-items: center;
  gap: var(--sp-1);
  flex-wrap: wrap;
}
.past-filters__label {
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
  min-width: 32px;
}

/* 试卷列表 */
.past-list { display: flex; flex-direction: column; gap: var(--sp-3); }
.past-paper {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--sp-3);
  cursor: pointer;
  transition: box-shadow 0.15s, border-color 0.15s;
}
.past-paper:hover { border-color: var(--brand-400); box-shadow: var(--shadow-sm); }
.past-paper__main { flex: 1; min-width: 0; }
.past-paper__title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: var(--sp-1);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.past-paper__meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-1);
}
.past-paper__chip {
  font-size: 11px;
  color: var(--text-secondary);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 1px var(--sp-1);
}
.past-paper__side {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: var(--sp-1);
  flex-shrink: 0;
}
.past-paper__status { font-size: 12px; color: var(--text-muted); }
.past-paper__status b { color: var(--brand-600); font-variant-numeric: tabular-nums; }
.past-paper__status.is-done { color: var(--ok); }
.past-paper__status.is-done b { color: var(--ok); }

/* 试卷详情 */
.past-detail__score {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: var(--sp-1);
  text-align: right;
}
.past-detail__score-num {
  font-size: 24px;
  font-weight: 700;
  color: var(--brand-600);
  font-variant-numeric: tabular-nums;
}
.past-detail__score-max { font-size: 14px; color: var(--text-muted); font-weight: 400; }
.past-detail__score-sub { font-size: 12px; color: var(--text-secondary); }
.past-detail__reasons {
  display: flex;
  gap: var(--sp-1);
  flex-wrap: wrap;
  justify-content: flex-end;
}
.past-detail__reasons .chip {
  background: var(--warn-bg);
  border-color: var(--warn);
  color: var(--gray-800);
}

/* 题目区 */
.past-questions {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
}
.past-q {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--sp-3);
}
.past-q.is-submitted { border-left: 3px solid var(--brand-400); }
.past-q__head {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-2);
}
.past-q__idx {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--brand-600);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
}
.past-q__score { font-size: 12px; color: var(--text-muted); }
.past-q__tag {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 1px var(--sp-1);
}
.past-q__tag.is-ok { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
.past-q__tag.is-bad { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); }
.past-q__stem {
  margin: 0 0 var(--sp-3);
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
}

/* 选项 */
.past-q__opts { display: flex; flex-direction: column; gap: var(--sp-2); }
.past-q__opts--multi { gap: var(--sp-2); }
.opt {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--sp-2) var(--sp-3);
  cursor: pointer;
  transition: all 0.15s;
  font-size: 13px;
  background: var(--surface);
}
.opt:hover { border-color: var(--brand-400); }
.opt.is-on {
  border-color: var(--brand-500);
  background: var(--brand-50);
}
.opt input { margin-top: 2px; cursor: pointer; }

/* 填空 */
.past-q__blank { margin-bottom: var(--sp-3); }
.past-q__blank input {
  width: 100%;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius-md);
  padding: var(--sp-2);
  font-size: 14px;
  color: var(--text);
  outline: none;
}
.past-q__blank input:focus { border-color: var(--brand-500); }

/* 单题操作 */
.past-q__foot {
  display: flex;
  justify-content: flex-end;
  padding-top: var(--sp-2);
}

/* 错因标签 */
.past-q__reason {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-1);
  margin-top: var(--sp-2);
  padding: var(--sp-2);
  background: var(--warn-bg);
  border-radius: var(--radius-md);
}
.past-q__reason-label { font-size: 12px; color: var(--gray-800); font-weight: 600; }
.past-q__reason .chip {
  background: var(--surface);
  border-color: var(--warn);
  color: var(--text-secondary);
}
.past-q__reason .chip.is-active {
  background: var(--warn);
  color: #fff;
}

/* 详细解析 */
.past-q__analysis {
  margin-top: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  background: var(--surface);
  border-left: 3px solid var(--brand-400);
  border-radius: var(--radius-md);
}
.past-q__analysis-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--brand-600);
  margin-bottom: var(--sp-1);
}
.past-q__analysis-body {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
}
.past-q__analysis-answer {
  margin-top: var(--sp-1);
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

/* 整卷操作 */
.past-paper__actions {
  display: flex;
  justify-content: flex-end;
}

@media (max-width: 480px) {
  .past-paper { flex-direction: column; align-items: stretch; }
  .past-paper__side { align-items: flex-start; }
  .past-detail__score { align-items: flex-start; text-align: left; }
  .past-detail__reasons { justify-content: flex-start; }
}

/* 通用字段（label + input/select 纵向堆叠，供模考/笔记等表单复用） */
.field {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  font-size: 11px;
  color: var(--text-secondary);
}
.field input,
.field select {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius-md);
  padding: var(--sp-1) var(--sp-2);
  font-size: 13px;
  color: var(--text);
  outline: none;
}
.field input:focus,
.field select:focus { border-color: var(--brand-500); }

/* ============ 模考分析模块 ============ */

:root {
  --chart-grid: var(--gray-100);
  --chart-score: var(--brand-500);
  --chart-acc: var(--ok);
  --chart-text: var(--text-muted);
}
@media (prefers-color-scheme: dark) {
  :root {
    --chart-grid: var(--gray-800);
    --chart-score: var(--brand-400);
  }
}

.mock-card { padding: var(--sp-4); }
.mock-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
  padding-bottom: var(--sp-3);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

/* 科目筛选 */
.mock-subjects {
  display: flex;
  gap: var(--sp-1);
  flex-wrap: wrap;
  margin-bottom: var(--sp-4);
}

/* 图表区 */
.mock-charts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
}
.mock-chart {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--sp-3);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-2);
}
.mock-chart__title { font-size: 13px; font-weight: 600; color: var(--text); }
.mock-chart__body {
  display: flex;
  justify-content: center;
  width: 100%;            /* flex 子项撑满父级，防被压缩到 0 */
  min-width: 0;
}
.mock-chart__body svg {
  /* 去 width/height 属性后用 CSS 兜底高度，随容器宽度等比缩放，防溢出 */
  width: 100%;
  height: auto;
  max-width: 360px;
  aspect-ratio: 17 / 10;
}
.mock-chart__body .kp-chart--radar {
  width: auto;
  max-width: 280px;
  aspect-ratio: 1 / 1;
}

/* SVG 图表基础 */
.kp-chart { display: block; }
.kp-chart--trend {
  background: var(--surface);
  border-radius: var(--radius-md);
}
.kp-chart--radar { background: transparent; }
.kp-radar__grid {
  fill: none;
  stroke: var(--chart-grid);
  stroke-width: 1;
}
.kp-radar__spoke {
  stroke: var(--chart-grid);
  stroke-width: 1;
}
.kp-radar__area {
  fill: var(--brand-500);
  fill-opacity: 0.25;
  stroke: var(--brand-500);
  stroke-width: 2;
}
.kp-radar__dot { fill: var(--brand-500); }
.kp-radar__dot.is-weak { fill: var(--bad); }
.kp-radar__label { fill: var(--text); font-weight: 600; }

/* 记录列表 */
.mock-list__title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin: 0 0 var(--sp-2);
}
.mock-list__empty {
  text-align: center;
  padding: var(--sp-4);
  color: var(--text-muted);
  font-size: 13px;
}
.mock-list__items {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}
.mock-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--sp-2) var(--sp-3);
  font-size: 13px;
}
.mock-item__meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 80px;
}
.mock-item__date { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.mock-item__subject {
  background: var(--brand-50);
  color: var(--brand-700);
  border: 1px solid var(--brand-100);
  padding: 0 var(--sp-1);
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 600;
  width: fit-content;
}
.mock-item__score {
  flex: 1;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.mock-item__weak {
  display: flex;
  gap: var(--sp-1);
  flex-wrap: wrap;
  justify-content: flex-end;
}
.mock-item__weak span {
  background: var(--warn-bg);
  color: var(--gray-800);
  border-radius: var(--radius-sm);
  padding: 0 var(--sp-1);
  font-size: 11px;
}
.mock-item__weak--none {
  background: var(--surface);
  color: var(--text-muted);
}
.mock-item__del {
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  padding: 2px;
  font-size: 14px;
}
.mock-item__del:hover { color: var(--bad); }

/* 模考添加表单（弹窗） */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: var(--sp-3);
}
.modal {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg, 0 8px 32px rgba(0, 0, 0, 0.18));
  width: 100%;
  max-width: 520px;
  overflow: hidden;
}
.modal__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--border);
}
.modal__head h3 { margin: 0; font-size: 16px; }
.modal__foot {
  display: flex;
  justify-content: flex-end;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4);
  border-top: 1px solid var(--border);
}
.mock-form form { padding: var(--sp-4); }
.mock-form__row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-3);
  margin-bottom: var(--sp-3);
}
.mock-form__row .field { flex: 1; min-width: 100px; }
.field__label {
  display: block;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: var(--sp-1);
}
.mock-form__dims {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
}
.mock-dim {
  display: flex;
  align-items: center;
  gap: var(--sp-1);
  font-size: 13px;
  cursor: pointer;
  color: var(--text-secondary);
}
.mock-dim input { cursor: pointer; }

/* ≤768px：模态改底部弹出（sheet），宽度 100%、仅上方圆角、≤90vh 内部可滚、遮罩点击可关 */
@media (max-width: 768px) {
  .mock-charts { grid-template-columns: 1fr; }

  .modal-overlay {
    align-items: flex-end;
    padding: 0;
    background: rgba(0, 0, 0, 0.45);
  }
  .modal {
    width: 100%;
    max-width: 100%;
    max-height: 90vh;
    border-radius: 20px 20px 0 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    animation: kp-sheet-up 0.28s cubic-bezier(.22,.61,.36,1);
  }
  .modal__head {
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 1;
  }
  .modal__head::before {
    content: '';
    display: block;
    width: 36px;
    height: 4px;
    border-radius: 999px;
    background: var(--gray-300);
    margin: 0 auto var(--sp-2);
  }
  /* 表单区可内部滚动 */
  .modal form {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .modal__foot {
    position: sticky;
    bottom: 0;
    background: var(--surface);
  }
  .modal__foot .btn { min-height: 44px; }
}

/* ============ 笔记模块 ============ */

.notes-card { padding: var(--sp-4); }
.notes-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
  padding-bottom: var(--sp-3);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.notes-card__empty { text-align: center; color: var(--text-muted); padding: var(--sp-6); font-size: 13px; }

/* 科目分组 */
.note-groups { display: flex; flex-direction: column; gap: var(--sp-4); }
.note-group__title {
  font-size: 14px;
  font-weight: 700;
  color: var(--brand-600);
  margin: 0 0 var(--sp-2);
  padding-bottom: var(--sp-1);
  border-bottom: 2px solid var(--brand-100);
}
.note-group__list {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

/* 笔记条目 */
.note-item {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--sp-3);
}
.note-item__head {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-1);
}
.note-item__tag {
  background: var(--brand-50);
  color: var(--brand-700);
  border-radius: var(--radius-sm);
  padding: 0 var(--sp-1);
  font-size: 11px;
  font-weight: 600;
}
.note-item__ts { font-size: 11px; color: var(--text-muted); margin-left: auto; }

/* Markdown 渲染 */
.note-item__body {
  font-size: 13px;
  color: var(--text);
  line-height: 1.6;
}
.note-item__body.is-raw {
  white-space: pre-wrap;
  font-family: var(--mono, monospace);
  font-size: 13px;
  line-height: 1.6;
  color: var(--text-secondary);
}
.note-md__h { margin: var(--sp-2) 0 var(--sp-1); font-size: 15px; font-weight: 700; }
.note-md__body p, .note-item__body p { margin: 0 0 var(--sp-1); }
.note-item__body ul { margin: 0; padding-left: 20px; }
.note-item__body code {
  background: var(--gray-100);
  border-radius: var(--radius-sm);
  padding: 0 4px;
  font-family: var(--mono, monospace);
  font-size: 12px;
}

/* Markdown 编辑器（编辑+预览双栏） */
.note-form {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--sp-3);
  margin-bottom: var(--sp-4);
}
.note-form--inline { margin-bottom: 0; }
.note-form__row {
  display: flex;
  gap: var(--sp-3);
  flex-wrap: wrap;
  margin-bottom: var(--sp-3);
}
.note-form__row .field { flex: 1; min-width: 120px; }
.note-form__foot {
  display: flex;
  justify-content: flex-end;
  gap: var(--sp-2);
  margin-top: var(--sp-3);
}
.note-md-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-2);
}
@media (max-width: 768px) {
  .note-md-split { grid-template-columns: 1fr; }
}
.note-md__editor {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius-md);
  padding: var(--sp-2);
  font-size: 13px;
  color: var(--text);
  font-family: var(--mono, monospace);
  min-height: 140px;
  resize: vertical;
  outline: none;
}
.note-md__editor:focus { border-color: var(--brand-500); }
.note-md__preview {
  border: 1px dashed var(--border);
  border-radius: var(--radius-md);
  padding: var(--sp-2);
  font-size: 13px;
  color: var(--text-secondary);
  background: var(--surface);
  overflow-y: auto;
  max-height: 240px;
}

/* ============ 学习计划模块 ============ */

.plan-card { padding: var(--sp-4); }
.plan-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
  padding-bottom: var(--sp-3);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.plan-card__head b { color: var(--brand-600); }

/* 完成率进度条 */
.plan-progress { margin-bottom: var(--sp-4); }
.plan-progress__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--sp-1);
  font-size: 12px;
  color: var(--text-secondary);
}
.plan-progress__label { font-weight: 600; color: var(--text); }
.plan-progress__pct { color: var(--brand-600); font-weight: 700; font-variant-numeric: tabular-nums; }
.plan-progress__bar {
  height: 8px;
  background: var(--gray-100);
  border-radius: 999px;
  overflow: hidden;
}
.plan-progress__fill {
  height: 100%;
  background: linear-gradient(90deg, var(--brand-400), var(--ok));
  transition: width 0.3s;
}

/* 快速添加表单 */
.plan-add {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--sp-3);
  margin-bottom: var(--sp-4);
}
.plan-add__row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: var(--sp-3);
}
.plan-add__field {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  font-size: 11px;
  color: var(--text-secondary);
  flex: 1;
  min-width: 100px;
}
.plan-add__field--content { flex: 2; min-width: 160px; }
.plan-add__field input,
.plan-add__field select {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius-md);
  padding: var(--sp-1) var(--sp-2);
  font-size: 13px;
  color: var(--text);
  outline: none;
}
.plan-add__field input:focus,
.plan-add__field select:focus { border-color: var(--brand-500); }

/* 主体布局：日历 + 当天任务 */
.plan-body {
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: var(--sp-4);
  align-items: start;
}

/* 日历 */
.plan-cal {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--sp-3);
}
.plan-cal__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--sp-2);
}
.plan-cal__title { font-size: 14px; font-weight: 600; }
.plan-cal__nav {
  border: 1px solid var(--border);
  background: var(--surface);
  width: 28px; height: 28px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 14px;
  color: var(--text-secondary);
}
.plan-cal__nav:hover { background: var(--brand-50); color: var(--brand-600); }
.plan-cal__today {
  border: none;
  background: transparent;
  color: var(--brand-600);
  font-size: 12px;
  cursor: pointer;
  text-decoration: underline;
}
.plan-cal__dow {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  margin-bottom: var(--sp-1);
}
.plan-cal__dow span {
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
  padding: var(--sp-1) 0;
}
.plan-cal__week {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  margin-bottom: 2px;
}
.plan-cal__cell {
  position: relative;
  border: none;
  background: transparent;
  cursor: pointer;
  aspect-ratio: 1;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: var(--text);
  transition: background 0.1s;
}
.plan-cal__cell:hover { background: var(--brand-50); }
.plan-cal__cell--empty { cursor: default; pointer-events: none; }
.plan-cal__cell.is-selected {
  background: var(--brand-600);
  color: #fff;
}
.plan-cal__cell.is-selected .plan-cal__tick { color: #fff; }
.plan-cal__cell.is-today { font-weight: 700; }
.plan-cal__cell.is-today::after {
  content: '';
  position: absolute;
  bottom: 3px;
  left: 50%;
  transform: translateX(-50%);
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--brand-500);
}
.plan-cal__cell.is-today.is-selected::after { background: #fff; }
.plan-cal__num { font-variant-numeric: tabular-nums; }
.plan-cal__tick {
  position: absolute;
  top: 2px; right: 4px;
  font-size: 10px;
  color: var(--ok);
}

/* 当天任务列表 */
.plan-day {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--sp-3);
  min-height: 200px;
}
.plan-day__title { font-size: 14px; font-weight: 600; margin-bottom: var(--sp-3); }
.plan-day__empty { font-size: 13px; color: var(--text-muted); }
.plan-day__list { list-style: none; margin: 0 0 var(--sp-3); padding: 0; display: flex; flex-direction: column; gap: var(--sp-2); }
.plan-task {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--sp-2);
  font-size: 13px;
}
.plan-task.is-done .plan-task__content { color: var(--text-muted); text-decoration: line-through; }
.plan-task__check {
  display: flex;
  align-items: center;
  cursor: pointer;
}
.plan-task__check input {
  appearance: none;
  width: 18px; height: 18px;
  border: 2px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  position: relative;
}
.plan-task__check input:checked {
  border-color: var(--ok);
  background: var(--ok);
}
.plan-task__check input:checked::after {
  content: '✓';
  color: #fff;
  font-size: 12px;
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.plan-task__subject {
  background: var(--brand-50);
  color: var(--brand-700);
  border: 1px solid var(--brand-100);
  padding: 1px var(--sp-1);
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 600;
}
.plan-task__content { flex: 1; }
.plan-task__dur { color: var(--text-muted); font-size: 12px; white-space: nowrap; }
.plan-task__del {
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  padding: 2px;
}
.plan-task__del:hover { color: var(--bad); }
.plan-day__actions { display: flex; justify-content: flex-end; }

/* 响应式 */
@media (max-width: 768px) {
  .plan-body { grid-template-columns: 1fr; }
  .plan-cal { order: 2; }
  .plan-day { order: 1; }
  /* 日历在下方：限宽居中，避免撑满过宽导致格子偏大、点按偏移 */
  .plan-cal {
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
  }
  .plan-cal__cell {
    min-height: 36px;
    /* 触达目标：格子 ≥ 36px，配合 7 列在 375px 屏内每格 ~48px */
  }
  .plan-cal__nav { width: 32px; height: 32px; }
}

/* ============ 仪表盘 ============ */

:root {
  /* 环形进度轨道色（深色模式覆写） */
  --ring-track: var(--gray-100);
}
@media (prefers-color-scheme: dark) {
  :root { --ring-track: var(--gray-800); }
}

.dashboard-card .card__title { font-size: 18px; }
.dashboard-card__head {
  margin-bottom: var(--sp-4);
  padding-bottom: var(--sp-3);
  border-bottom: 1px solid var(--border);
}

/* 进度环网格：4 科 + 时间环 */
.dash-rings {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: var(--sp-3);
  margin: 0 0 var(--sp-4);
}
.dash-ring {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-1);
  padding: var(--sp-3);
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.dash-ring__svg { display: flex; align-items: center; justify-content: center; }
.dash-ring__svg .kp-ring { display: block; }
.dash-ring__label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}
.dash-ring__meta {
  font-size: 11px;
  color: var(--text-muted);
  text-align: center;
  line-height: 1.4;
}
.dash-ring--time {
  border-color: var(--ok);
  background: var(--ok-bg);
}
.dash-ring--time .dash-ring__label { color: var(--gray-800); }

/* SVG 环形进度 */
.kp-ring__track { opacity: 0.35; }
.kp-ring__value {
  transition: stroke-dashoffset 0.4s ease;
}
.kp-ring__label {
  fill: var(--text);
  font-family: inherit;
  font-weight: 700;
}

/* 统计卡 */
.dash-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: var(--sp-3);
  margin: 0 0 var(--sp-4);
}
.stat {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  padding: var(--sp-4);
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  transition: all 0.15s;
}
.stat:hover { border-color: var(--brand-400); box-shadow: var(--shadow-sm); }
.stat__num {
  font-size: 28px;
  font-weight: 700;
  color: var(--brand-600);
  font-variant-numeric: tabular-nums;
}
.stat__label { font-size: 13px; color: var(--text-secondary); }
.stat__hint { font-size: 11px; color: var(--text-muted); }

/* 今日任务摘要 */
.dashboard-today {
  background: var(--brand-50);
  border: 1px solid var(--brand-100);
  border-radius: var(--radius-lg);
  padding: var(--sp-4);
}
.dashboard-today__title {
  font-size: 14px;
  font-weight: 600;
  color: var(--brand-700);
  margin: 0 0 var(--sp-3);
}
.dashboard-today__empty {
  margin: 0;
  font-size: 13px;
  color: var(--text-secondary);
}
.dash-tasks {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}
.dash-task {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  background: var(--surface);
  border: 1px solid var(--brand-100);
  border-radius: var(--radius-md);
  text-decoration: none;
  color: var(--text);
  font-size: 13px;
  transition: all 0.15s;
}
.dash-task:hover { border-color: var(--brand-400); box-shadow: var(--shadow-sm); }
.dash-task__icon { font-size: 16px; }
.dash-task__text { flex: 1; }
.dash-task__text b { color: var(--brand-700); font-weight: 700; }
.dash-task__go {
  font-size: 12px;
  color: var(--brand-600);
  font-weight: 600;
  white-space: nowrap;
}
.dash-task--checkin { border-color: var(--ok); background: var(--ok-bg); }
.dash-task--checkin .dash-task__go { color: var(--gray-800); }

@media (max-width: 480px) {
  .stat__num { font-size: 22px; }
  .review-card__head { flex-direction: column; align-items: stretch; }
  .review-card__progress { min-width: 0; }
  .dash-rings { grid-template-columns: repeat(2, 1fr); }

  /* ---------- 全站触达目标兜底（44px） ---------- */
  /* 表单按钮、chip、单选/多选、导航、计划任务、模态脚部按钮 */
  .btn, .btn--sm { min-height: 44px; }
  .chip { min-height: 40px; }
  .opt, .quiz-opt, .mock-dim { min-height: 44px; }
  .plan-task { min-height: 48px; }
  .modal__foot .btn, .mock-form__dims .mock-dim { min-height: 44px; }
  .note-form__foot .btn { min-height: 44px; }
  .dash-task { min-height: 48px; }

  /* 防止横向滚动：长词/代码/长 URL 可断行 */
  .card, .note-item__body, .past-q__analysis-body, .quiz-card__stem {
    overflow-wrap: break-word;
    word-break: break-word;
  }

  /* 横竖屏 / 刘海屏：tabbar 贴底并让位 safe-area（已在 768px 块定义，这里再兜底一次） */
  .tabbar { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 0px); }
}

/* ---------- 键盘弹起时，模态输入框上移（visualViewport 兜底 + 默认 safe-area） ---------- */
/* 移动端 modal 输入时，浏览器自动上移视口；这里确保 modal 底部不贴到键盘 */
@media (max-width: 768px) {
  .modal { max-height: 88dvh; }
}

/* ============ 移动端体验增强（2026-11） ============ */
/* 目标：更简洁 / 更流畅 / 更美观；保留设计系统变量，只新增不改已有。 */

/* ---------- tabbar：单行水平可滚（替代双行 5+4） ---------- */
/* 移动端：6 项（5 核心 + 1 更多），单行 56px，每格 ≈1/6 屏宽，横向不溢出无需滚动 */
@media (max-width: 768px) {
  :root {
    --tabbar-h: 56px;
    --tabbar-rows: 1;
  }
  .tabbar {
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 0 var(--sp-2);
    box-sizing: border-box;
  }
  .tabbar::-webkit-scrollbar { display: none; }
  .tabbar__item {
    flex: 1 1 0;
    min-width: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 12px;
    padding: 6px 4px;
    border-radius: 8px;
    position: relative;
    transition: color 0.15s ease-out, background 0.15s ease-out;
  }
  .tabbar__item.is-active {
    color: var(--brand-600);
    background: color-mix(in srgb, var(--brand-500) 10%, transparent);
  }
  .tabbar__item.is-active::after {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 2px;
    background: var(--brand-500);
    border-radius: 2px;
  }
  .tabbar__icon { font-size: 18px; line-height: 1; }
}

/* ---------- 顶栏：移动端精简 ---------- */
@media (max-width: 768px) {
  .topbar {
    gap: var(--sp-2);
    padding: 0 var(--sp-3);
    height: 52px;
  }
  .topbar__logo {
    width: 32px;
    height: 32px;
    font-size: 14px;
  }
  .topbar__title {
    font-size: 15px;
    font-weight: 600;
  }
  .topbar__center {
    font-size: 11px;
  }
  .topbar__center .topbar__days {
    font-size: 14px;
  }
  .btn--ghost.btn--icon .btn-txt {
    display: none;
  }
}

/* ---------- 卡片：移动端紧凑 ---------- */
@media (max-width: 768px) {
  .card {
    border-radius: 12px;
    padding: var(--sp-3);
  }
  .card__title {
    font-size: 16px;
  }
  .card__desc {
    font-size: 13px;
  }
}

/* ---------- 仪表盘：统计卡 2x2 网格 ---------- */
@media (max-width: 768px) {
  .dash-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--sp-2);
  }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: var(--sp-3);
    border-radius: 10px;
    background: var(--surface-2, var(--gray-50));
  }
  .stat__num {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
  }
  .stat__label {
    font-size: 12px;
    color: var(--text-secondary);
  }
  .stat__hint {
    font-size: 11px;
    color: var(--text-tertiary, var(--gray-400));
  }
}

/* ---------- "更多" sheet ---------- */
.sheet-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease-out;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet-overlay.is-open {
  opacity: 1;
  pointer-events: auto;
}
.sheet {
  width: 100%;
  max-width: 480px;
  background: var(--surface);
  border-radius: 16px 16px 0 0;
  padding: var(--sp-3) var(--sp-4) calc(var(--sp-4) + env(safe-area-inset-bottom, 0px));
  transform: translateY(100%);
  transition: transform 0.25s ease-out;
  box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.15);
}
.sheet-overlay.is-open .sheet {
  transform: translateY(0);
}
.sheet__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--sp-3);
}
.sheet__title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}
.sheet__close {
  width: 28px;
  height: 28px;
  border: none;
  background: var(--gray-100);
  border-radius: 50%;
  color: var(--text-secondary);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sheet__body {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.sheet__item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3);
  border: none;
  background: transparent;
  border-radius: 10px;
  font-size: 15px;
  color: var(--text);
  cursor: pointer;
  text-align: left;
  width: 100%;
  transition: background 0.15s;
}
.sheet__item:hover, .sheet__item:active {
  background: var(--gray-50);
}
.sheet__item--muted {
  color: var(--text-secondary);
  font-size: 14px;
}
.sheet__hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: var(--sp-2) 0;
}
/* 桌面：sheet 居中 */
@media (min-width: 769px) {
  .sheet-overlay {
    align-items: center;
    justify-content: center;
  }
  .sheet {
    max-width: 420px;
    border-radius: 16px;
    transform: translateY(20px) scale(0.96);
    opacity: 0;
    transition: transform 0.2s ease-out, opacity 0.2s ease-out;
  }
  .sheet-overlay.is-open .sheet {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
}

/* ---------- 题库筛选：移动端可折叠，默认收起 ---------- */
/* 桌面保留完整；移动端把 科目/章节/题型/难度 4 组收进"筛选"开关，
   露出搜索 + 已选摘要，减少首屏杂乱。
   注意：主 styles.css 把 .quiz-filters__group 设为 display:flex（非 @media），
   因此移动端需用子选择器 [data-filters-collapse] .quiz-filters__group 强制覆盖。 */
.quiz-filters__toggle {
  display: none; /* 桌面隐藏 */
}
@media (max-width: 768px) {
  .quiz-filters {
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
    flex-wrap: nowrap;
  }
  /* 快速行：搜索 + 筛选开关，横向 */
  .quiz-filters__quick {
    display: flex;
    gap: var(--sp-2);
    align-items: center;
  }
  .quiz-filters__search { flex: 1; min-width: 0; }
  .quiz-filters__toggle {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    border-radius: 999px;
    padding: 0 var(--sp-3);
    font-size: 13px;
    cursor: pointer;
    min-height: 36px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .quiz-filters__toggle.is-open { color: var(--brand-600); border-color: var(--brand-400); }
  .quiz-filters__toggle__badge {
    font-size: 11px;
    background: var(--brand-600);
    color: #fff;
    border-radius: 999px;
    min-width: 16px;
    height: 16px;
    line-height: 16px;
    text-align: center;
    padding: 0 4px;
  }
  /* 已选摘要（默认隐藏，有筛选时 JS 加 .is-shown） */
  .quiz-filters__active { display: none; }
  .quiz-filters__active.is-shown {
    display: flex;
    gap: var(--sp-2);
    flex-wrap: wrap;
  }
  /* 4 个分组 + 限时默认收起（需子选择器覆盖主 CSS 的 display:flex） */
  .quiz-filters__collapsible {
    display: none;
    flex-direction: column;
    gap: var(--sp-2);
  }
  .quiz-filters__collapsible.is-open {
    display: flex;
  }
  /* 覆盖主 CSS 的 group 显示 */
  [data-filters-collapse] .quiz-filters__group {
    display: flex;
    flex-wrap: wrap;
    gap: var(--sp-2);
  }
  [data-filters-collapse] .quiz-filters__limit {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
  }
}

/* ---------- 通用：表单控件 / 输入框 ---------- */
@media (max-width: 768px) {
  input[type="text"], input[type="number"], input[type="date"], input[type="tel"], select, textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-size: 15px; /* iOS 防止聚焦缩放 */
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--brand-500);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand-500) 15%, transparent);
  }
}

/* ---------- 择校模块 ---------- */
.sugg-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: var(--sp-3);
  overflow: hidden;
}
.sugg-card__head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--sp-3) var(--sp-4);
  background: var(--surface-2, var(--gray-50));
  border-bottom: 1px solid var(--border);
}
.sugg-card__group {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}
.sugg-card__tier {
  font-size: 12px;
  font-weight: 500;
}
.sugg-card__list {
  display: flex;
  flex-direction: column;
}
.sugg-row {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4);
  border: none;
  border-bottom: 1px solid var(--border);
  background: transparent;
  cursor: pointer;
  text-align: left;
  font-size: 14px;
  color: var(--text);
  transition: background 0.12s;
}
.sugg-row:last-child { border-bottom: none; }
.sugg-row:hover, .sugg-row:active { background: var(--gray-50); }
.sugg-row__name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sugg-row__tag {
  font-size: 11px;
  color: var(--text-secondary);
  background: var(--gray-100);
  border-radius: 999px;
  padding: 2px 8px;
  white-space: nowrap;
}
.sugg-row__prob {
  font-size: 13px;
  font-weight: 600;
  min-width: 40px;
  text-align: right;
}
.sugg-row__fav { color: var(--ok); font-size: 12px; min-width: 16px; }
.sugg-actions {
  margin-top: var(--sp-3);
  display: flex;
  justify-content: center;
}

/* ---------- 院校详情弹窗 ---------- */
.detail-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  padding: var(--sp-4);
}
.detail-overlay.is-open { display: flex; }
.detail-panel {
  background: var(--surface);
  border-radius: 16px;
  padding: var(--sp-5, 20px);
  max-width: 480px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  position: relative;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
}
.detail-close {
  position: absolute;
  top: var(--sp-3);
  right: var(--sp-3);
  width: 28px;
  height: 28px;
  border: none;
  background: var(--gray-100);
  border-radius: 50%;
  cursor: pointer;
  color: var(--text-secondary);
}
.detail-tag {
  font-size: 13px;
  color: var(--text-secondary);
  margin: 4px 0 var(--sp-3);
}
.detail-tags {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
}
.detail-block { margin-bottom: var(--sp-3); }
.detail-block h4 {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 4px;
}
.detail-block p { font-size: 14px; color: var(--text); }
.detail-actions {
  display: flex;
  gap: var(--sp-2);
  margin-top: var(--sp-4);
}

/* ---------- 志愿模拟填报 ---------- */
.apply-grid {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  margin: var(--sp-4) 0;
}
.apply-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: var(--sp-2);
  align-items: center;
  padding: var(--sp-3);
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface-2, var(--gray-50));
}
.apply-row__label {
  font-weight: 600;
  font-size: 14px;
  color: var(--text);
  grid-column: 1 / -1;
}
.apply-row__desc {
  font-size: 12px;
  font-weight: 400;
  color: var(--text-secondary);
  margin-left: 8px;
}
.apply-row__select {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  font-size: 14px;
}
.apply-row__check {
  font-size: 13px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 8px;
  white-space: nowrap;
}
.apply-row__check.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.apply-row__check.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.apply-actions {
  display: flex;
  gap: var(--sp-2);
  justify-content: flex-end;
  margin-top: var(--sp-3);
}
.apply-submissions {
  margin-top: var(--sp-3);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.apply-sub {
  display: flex;
  gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-3);
  border-radius: 8px;
  background: var(--gray-50);
  font-size: 13px;
  color: var(--text-secondary);
}

/* ---------- 报名模拟 ---------- */
.signup-tl {
  display: flex;
  gap: 0;
  margin: var(--sp-4) 0;
  overflow-x: auto;
  padding-bottom: var(--sp-2);
}
.tl-node {
  flex: 0 0 auto;
  min-width: 90px;
  padding: var(--sp-3) 10px;
  text-align: center;
  position: relative;
  border-radius: 10px;
  background: var(--surface-2, var(--gray-50));
  border: 1px solid var(--border);
}
.tl-node__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--gray-300);
  margin: 0 auto var(--sp-2);
}
.tl-node--done .tl-node__dot { background: var(--ok); }
.tl-node--current .tl-node__dot { background: var(--brand-500); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand-500) 20%, transparent); }
.tl-node__label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 2px;
}
.tl-node__desc {
  font-size: 11px;
  color: var(--text-secondary);
  line-height: 1.3;
}
.tl-node__days {
  margin-top: 4px;
  font-size: 11px;
  color: var(--text-tertiary, var(--gray-400));
}

.signup-form {
  margin: var(--sp-3) 0;
  padding: var(--sp-4);
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface-2, var(--gray-50));
}
.signup-form .card__title { margin-bottom: 4px; }
.signup-field { margin-bottom: var(--sp-3); }
.signup-field__label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 4px;
}
.signup-field__hint {
  font-size: 12px;
  color: var(--text-tertiary, var(--gray-400));
  margin-top: 4px;
}
.signup-fee {
  font-size: 24px;
  font-weight: 700;
  color: var(--brand-600);
  margin: var(--sp-2) 0;
}
.signup-agree {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  font-size: 13px;
  color: var(--text-secondary);
}
.signup-actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--sp-2);
  margin-top: var(--sp-3);
}
.signup-done {
  text-align: center;
  padding: var(--sp-5, 24px) var(--sp-4);
}
.signup-done__mark {
  font-size: 48px;
  color: var(--ok);
  margin-bottom: var(--sp-2);
}
.signup-sum {
  display: flex;
  justify-content: space-between;
  padding: var(--sp-2) 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.signup-sum__k { color: var(--text-secondary); }
.signup-sum__v { font-weight: 500; }

/* ---------- 成绩分析 ---------- */
.score-form {
  margin: var(--sp-4) 0;
  padding: var(--sp-4);
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface-2, var(--gray-50));
}
.score-form__head {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
}
.score-form__label { font-size: 13px; color: var(--text-secondary); }
.score-form__label-input {
  flex: 1;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  font-size: 14px;
}
.score-form__grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--sp-3);
}
@media (min-width: 769px) {
  .score-form__grid { grid-template-columns: repeat(4, 1fr); }
}
.score-input {
  padding: var(--sp-3);
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
}
.score-input__label {
  display: block;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 4px;
}
.score-input__label span { font-weight: 400; color: var(--text-tertiary, var(--gray-400)); }
.score-input__value {
  width: 100%;
  box-sizing: border-box;
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  padding: 6px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
}
.score-input__norm {
  margin-top: 4px;
  font-size: 11px;
  color: var(--text-tertiary, var(--gray-400));
  text-align: center;
}
.score-form__actions { margin-top: var(--sp-3); text-align: right; }

.score-diag {
  margin: var(--sp-3) 0;
  padding: var(--sp-3);
  border-radius: 10px;
  background: var(--surface-2, var(--gray-50));
  border: 1px solid var(--border);
}
.score-diag__weak {
  margin: var(--sp-2) 0;
  font-size: 13px;
  color: var(--text);
}
.score-diag__ok {
  font-size: 13px;
  color: var(--ok);
}
.score-diag__advice {
  font-size: 13px;
  color: var(--text-secondary);
  margin: var(--sp-2) 0;
}
.score-diag__rank {
  font-size: 14px;
  color: var(--text);
}

.score-list {
  margin-top: var(--sp-3);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}
.score-item {
  padding: var(--sp-3);
  border-radius: 10px;
  background: var(--surface-2, var(--gray-50));
  border: 1px solid var(--border);
}
.score-item__head {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  flex-wrap: wrap;
  margin-bottom: var(--sp-2);
}
.score-item__total { font-weight: 600; color: var(--brand-600); font-size: 14px; }
.score-item__pct {
  font-size: 12px;
  color: var(--text-secondary);
  background: var(--gray-100);
  padding: 2px 8px;
  border-radius: 999px;
}
.score-item__date { font-size: 12px; color: var(--text-tertiary, var(--gray-400)); margin-left: auto; }
.score-item__scores {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
}
.score-chip {
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--gray-100);
  color: var(--text-secondary);
}
.score-trend {
  margin: var(--sp-3) 0;
  padding: var(--sp-3);
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
}
.score-trend svg { display: block; margin: 0 auto; max-width: 100%; }

/* ---------- 仪表盘：功能入口卡 ---------- */
.dash-entries {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--sp-2);
  margin-top: var(--sp-3);
}
.dash-entry {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: var(--sp-3);
  border-radius: 10px;
  background: var(--surface-2, var(--gray-50));
  border: 1px solid var(--border);
  text-decoration: none;
  color: var(--text);
  font-size: 13px;
  transition: border-color 0.15s, background 0.15s;
}
.dash-entry:hover, .dash-entry:active {
  border-color: var(--brand-400);
  background: color-mix(in srgb, var(--brand-500) 8%, transparent);
}
.dash-entry__icon { font-size: 20px; }

/* ---------- 今日待办任务 ---------- */
.dashboard-today {
  margin-top: var(--sp-3);
  padding: var(--sp-3);
  border-radius: 10px;
  background: var(--surface-2, var(--gray-50));
  border: 1px solid var(--border);
}
.dashboard-today__title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: var(--sp-2);
}
.dashboard-today__empty {
  font-size: 13px;
  color: var(--ok);
  text-align: center;
}
.dash-tasks {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}
.dash-task {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2);
  border-radius: 8px;
  text-decoration: none;
  color: var(--text);
  font-size: 13px;
  background: var(--surface);
  border: 1px solid var(--border);
  transition: border-color 0.15s;
}
.dash-task:hover, .dash-task:active {
  border-color: var(--brand-400);
}
.dash-task__icon { font-size: 16px; }
.dash-task__text { flex: 1; }
.dash-task__go { color: var(--text-tertiary, var(--gray-400)); font-size: 12px; }

/* ---------- 通用 chip（复用现有 .chip，此处只补 is-active 颜色） ---------- */
.chip {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.chip.is-active {
  background: var(--brand-500);
  color: #fff;
  border-color: var(--brand-500);
}

/* ---------- 按钮按压缩放（移动端手感） ---------- */
@media (hover: none) {
  .btn:active, .chip:active, .tabbar__item:active, .sheet__item:active,
  .sugg-row:active, .dash-entry:active, .dash-task:active {
    transform: scale(0.97);
  }
}

/* 模块：考试成绩分析
 * 数据层：KP_CONTENT.kp_scoreNorm（全国平均分参考）
 * 存储层：kp_store 'score.submissions'（成绩记录）
 * 功能：多科成绩录入 + 总分/位次估算 + 趋势 + 薄弱点诊断 + 院校匹配
 */
(function (global) {
  'use strict';

  var C = {};

  var SUBJECTS = ['政治', '英语', '数学', '专业课'];
  var FULL = { '政治': 100, '英语': 100, '数学': 150, '专业课': 150 };
  var NORM = {
    '政治':  { avg: 58, sd: 14, top: 80 },
    '英语':  { avg: 62, sd: 16, top: 85 },
    '数学':  { avg: 75, sd: 20, top: 108 },
    '专业课': { avg: 105, sd: 24, top: 145 }
  };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* 位次估算：按正态分布累计（1 个标准差 ≈ 68%） */
  function estPercentile(score, avg, sd) {
    if (!sd) return 0.5;
    var z = (score - avg) / sd;
    /* 近似误差函数：数值积分法（Simpson 200 步） */
    var N = 200, lo = -4, hi = z;
    if (lo > hi) { var t = lo; lo = hi; hi = t; }
    var dx = (hi - lo) / N;
    var sum = 0;
    for (var i = 0; i <= N; i++) {
      var x = lo + i * dx;
      var w = (i === 0 || i === N) ? 1 : (i % 2 ? 4 : 2);
      sum += w * Math.exp(-0.5 * x * x);
    }
    var integral = (dx / 3) * sum;
    return Math.max(0, Math.min(1, 0.5 + integral / 2.5066282746));
  }

  C.addRecord = function (scores, label, view) {
    var store = global.KP_STORE;
    if (!store) return;
    var subs = store.get('score.submissions') || [];
    var total = 0, maxTotal = 0;
    SUBJECTS.forEach(function (s) {
      var v = Number(scores[s]) || 0;
      total += v;
      maxTotal += FULL[s];
    });
    /* 位次估算：各科分别估算后取平均 */
    var pctAvg = 0;
    SUBJECTS.forEach(function (s) {
      var v = Number(scores[s]) || 0;
      var n = NORM[s];
      pctAvg += estPercentile(v, n.avg, n.sd) / SUBJECTS.length;
    });
    var sub = {
      id: 'sc' + Date.now().toString(36),
      label: label || ('第 ' + (subs.length + 1) + ' 次'),
      scores: scores,
      total: total,
      pct: Math.round(pctAvg * 10000) / 100,
      ts: new Date().toISOString(),
      date: new Date().toISOString().slice(0, 10)
    };
    subs.unshift(sub);
    if (subs.length > 30) subs.length = 30;
    store.set('score.submissions', subs);
    C.render(view);
  };

  C.render = function (view) {
    var store = global.KP_STORE;
    var subs = store ? (store.get('score.submissions') || []) : [];
    var self = this;

    var latest = subs[0] || null;

    /* 诊断：基于最新一次 */
    var diagHtml = '';
    if (latest) {
      var weak = [];
      SUBJECTS.forEach(function (s) {
        var v = Number(latest.scores[s]) || 0;
        var n = NORM[s];
        var p = estPercentile(v, n.avg, n.sd);
        if (p < 0.45) weak.push(s);
      });
      var totalPct = latest.pct;
      var advice = totalPct >= 80 ? '冲刺 985 院校，建议主攻专业课拉分'
        : totalPct >= 65 ? '报考 211 / 强势双非，稳住政治英语'
        : totalPct >= 50 ? '建议「保底」志愿为主，优先选择国家线 B 区'
        : '基础薄弱期：先 6 个月打地基，不要急于择校';
      diagHtml = '<div class="score-diag" data-score-diag>' +
        '<h3 class="card__title">诊断（基于 ' + esc(latest.label) + '）</h3>' +
        (weak.length
          ? '<p class="score-diag__weak">薄弱科目：' +
            weak.map(function (w) { return '<span class="chip">' + w + '</span>'; }).join(' ') +
            '</p>' : '<p class="score-diag__ok">各科均衡，无明显短板</p>') +
        '<p class="score-diag__advice">建议：' + esc(advice) + '</p>' +
        '<p class="score-diag__rank">全国位次估算 <b>' + totalPct + '%</b></p>' +
      '</div>';
    }

    /* 趋势（最新 6 次，KP_CHARTS.trend 期望 score + accuracy(0-1) 字段） */
    var trendData = subs.slice(0, 6).map(function (s) {
      return { label: s.label, score: s.total, accuracy: s.pct / 100 };
    }).reverse();

    var trendHtml = '';
    if (trendData.length >= 2) {
      trendHtml = '<div class="score-trend" data-score-trend></div>';
    }

    /* 提交记录列表 */
    var listHtml = '';
    if (subs.length) {
      listHtml = '<h3 class="card__title" style="margin-top:var(--sp-4)">提交记录</h3><div class="score-list">' +
        subs.slice(0, 10).map(function (s) {
          var scores = SUBJECTS.map(function (k) {
            return '<span class="score-chip">' + k + ' ' + esc(String(s.scores[k] || 0)) + '</span>';
          }).join('');
          return '<div class="score-item">' +
            '<div class="score-item__head">' +
              '<b>' + esc(s.label) + '</b>' +
              '<span class="score-item__total">' + s.total + ' 分</span>' +
              '<span class="score-item__pct">' + s.pct + '%</span>' +
              '<span class="score-item__date">' + esc(s.date) + '</span>' +
            '</div>' +
            '<div class="score-item__scores">' + scores + '</div>' +
          '</div>';
        }).join('') +
      '</div>';
    }

    view.innerHTML =
      '<div class="card score-card">' +
        '<h2 class="card__title">考试成绩分析</h2>' +
        '<p class="card__desc">录入模考/真题成绩 · 自动诊断 · 位次估算</p>' +

        '<div class="score-form" data-score-form>' +
          '<div class="score-form__head">' +
            '<label class="score-form__label">批次</label>' +
            '<input class="score-form__label-input" type="text" data-score-label ' +
              'placeholder="如：第 3 次模考" value="" />' +
          '</div>' +
          '<div class="score-form__grid">' +
            SUBJECTS.map(function (s) {
              return '<div class="score-input" data-score-input="' + s + '">' +
                '<label class="score-input__label">' + s + ' <span>（' + FULL[s] + '）</span></label>' +
                '<input class="score-input__value" type="number" min="0" max="' + FULL[s] + '" ' +
                  'placeholder="0" />' +
                '<div class="score-input__norm">参考 平均 ' + NORM[s].avg +
                  ' / 优秀 ' + NORM[s].top + '</div>' +
              '</div>';
            }).join('') +
          '</div>' +
          '<div class="score-form__actions">' +
            '<button class="btn btn--primary" data-score-submit>提交并分析</button>' +
          '</div>' +
        '</div>' +

        diagHtml +
        trendHtml +
        listHtml +
      '</div>';

    /* 趋势图 */
    var tEl = view.querySelector('[data-score-trend]');
    if (tEl && global.KP_CHARTS) {
      global.KP_CHARTS.trend(tEl, trendData, { leftMax: 500 });
    }

    view.addEventListener('click', function (e) {
      var sub = e.target.closest('[data-score-submit]');
      if (!sub) return;
      var form = view.querySelector('[data-score-form]');
      var scores = {};
      SUBJECTS.forEach(function (s) {
        var el = form.querySelector('[data-score-input="' + s + '"] input');
        scores[s] = el ? (Number(el.value) || 0) : 0;
      });
      var labelEl = form.querySelector('[data-score-label]');
      var label = labelEl ? labelEl.value.trim() : '';
      self.addRecord(scores, label || undefined, view);
    }, true);
  };

  global.KP_SCORE = C;
})(typeof window !== 'undefined' ? window : this);


/* 应用入口：导航切换 + 题库练习模块 + 各模块占位渲染 */

  /* ---------- 仪表盘 ---------- */

      var model = global.KP_MODEL;

      var todayStr = new Date().toISOString().slice(0, 10);
